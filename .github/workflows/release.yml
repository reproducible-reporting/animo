# Everything a release needs, up to the point where a human decision starts.
# It builds the subtree that would be copied into `typst/packages`, checks it with the
# Universe package checker, and attaches it to a GitHub release with the notes from
# `CHANGELOG.md`.
#
# It stops at the artefact.
# Copying that subtree into a sparse checkout of `typst/packages` and opening the pull
# request stays manual, because a submission cannot be taken back.
name: release

on:
  push:
    tags:
      - v*
  # So that the steps below can be exercised before a tag exists.
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, as it stands in typst.toml
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The agreement between the tag and the manifest is a mapping rather than a copy,
      # so it is checked here instead of being written by `snipwise`.
      # The script refuses the build when the two disagree.
      - name: Build the publishable subtree
        run: >-
          ./tools/build_package.py
          --destination build/package
          --expect-version ${{ inputs.version || github.ref }}

      # The checker reads the subtree that is submitted, which is not the working tree,
      # so it is pointed at the copy above rather than at the checkout.
      - name: Check the package as it would be submitted
        run: >-
          docker run -v ${{ github.workspace }}/build/package:/data
          ghcr.io/typst/package-check check

      - name: Extract the release notes
        run: >-
          ./tools/release_notes.py ${{ inputs.version || github.ref }}
          > build/release-notes.md

      - name: Pack the subtree
        run: tar -czf build/animo-${{ inputs.version || github.ref_name }}.tar.gz -C build/package .

      - uses: actions/upload-artifact@v5
        with:
          name: package
          path: build/package

      # Only a tag publishes. A manual run stops at the artifact above, which is what
      # makes the steps exercisable without creating a release.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create ${{ github.ref_name }}
          --title ${{ github.ref_name }}
          --notes-file build/release-notes.md
          build/animo-${{ github.ref_name }}.tar.gz
