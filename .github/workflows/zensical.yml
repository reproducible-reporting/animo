# The documentation site, built with `--strict` so that a broken link fails the build.
name: zensical

on:
  push:
    branches:
      # Every commit on the main branch republishes the site,
      # so that the documentation never lags behind the code.
      - main
  pull_request:
    # Build without publishing on pull requests ...
    paths:
      # ... only if relevant files have changed.
      # `docs/` includes the examples verbatim through `pymdownx.snippets`.
      - docs/**
      - examples/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/zensical.yml

concurrency:
  group: zensical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-default-groups --group docs
      - run: uv run zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only `main` is published; a pull request builds the site and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
