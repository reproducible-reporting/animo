# The Universe package checker, over the package as it would be submitted.
name: lint

on:
  push:
    branches:
      # Check the package for a change on the main branch ...
      - main
    paths:
      # ... and only if relevant files have changed.
      # The checker reads the subtree that is submitted to `typst/packages`,
      # so this list must stay consistent with the `exclude` field of `typst.toml`.
      - src/**
      - typst.toml
      - README.md
      - CHANGELOG.md
      - LICENSES/**
      - .github/workflows/lint.yml
  pull_request:
    # Check the package on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - src/**
      - typst.toml
      - README.md
      - CHANGELOG.md
      - LICENSES/**
      - .github/workflows/lint.yml

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The checker runs as a container rather than through its own GitHub Action,
      # because that action expects credentials for a GitHub App
      # that a personal repository does not have.
      - run: docker run -v ${{ github.workspace }}:/data ghcr.io/typst/package-check check
