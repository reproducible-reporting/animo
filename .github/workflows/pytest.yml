# The three tiers and the probes, against the typst release the manifest pins.
name: pytest

on:
  workflow_dispatch:
  push:
    branches:
      # Run the suite for a change on the main branch ...
      - main
    paths:
      # ... and only if relevant files have changed.
      - src/**
      - tests/**
      - probes/**
      - docs/**
      - examples/**
      - README.md
      - conftest.py
      - typst.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/pytest.yml
  pull_request:
    # Run the suite on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - src/**
      - tests/**
      - probes/**
      - docs/**
      - examples/**
      - README.md
      - conftest.py
      - typst.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/pytest.yml

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.part }})
    runs-on: ubuntu-latest
    # The suite is split into parts that run in parallel.
    # The tiers that only need typst form one part, which installs no browser,
    # and the browser tier runs in each engine as a part of its own.
    # The markers partition the suite, so every test runs in exactly one part.
    strategy:
      # A failure in one engine does not cancel the others,
      # so that one run shows every engine that a change breaks.
      fail-fast: false
      matrix:
        include:
          - part: plan and paged
            marker: not browser
          - part: chromium
            marker: browser
            engine: chromium
          - part: firefox
            marker: browser
            engine: firefox
          - part: webkit
            marker: browser
            engine: webkit
    env:
      # The same place `setup.sh` and `.envrc` put it,
      # so that one rule locates the browser on a contributor's machine and here.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.venv/playwright
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.0"
      # `setup-uv` restores its cache into the `cache-dir` of `pyproject.toml`,
      # which is `.venv/cache`, so `.venv` already exists here as a plain directory
      # and `uv sync` refuses to adopt it.
      # Creating the environment first is what `setup.sh` does on a contributor's machine.
      # Observed with `astral-sh/setup-uv@v10.1.0` and `uv` 0.12.13.
      - run: uv venv --allow-existing
      # The test suite needs `pytest` and nothing else,
      # so it does not build `pre-commit`, StepUp or Zensical.
      - run: uv sync --no-default-groups --group tests
      # This runner is ubuntu, which is the one platform all three engines run on.
      - if: matrix.engine
        run: uv run playwright install --with-deps ${{ matrix.engine }}
      # Naming the engine makes it required: an engine that failed to install
      # then fails the job rather than skipping quietly and leaving it green.
      - if: matrix.engine
        run: uv run pytest -m "${{ matrix.marker }}" --browser ${{ matrix.engine }}
      - if: ${{ !matrix.engine }}
        run: uv run pytest -m "${{ matrix.marker }}"
