# Formatting and hygiene run on pre-commit.ci rather than in a workflow of their own,
# because every hook below installs there and the service pushes the fixes that
# `mdformat` and `snipwise fix` make instead of failing a pull request with a diff.
ci:
  # `typstyle` is pinned to the typst release that `typst.toml` declares,
  # so bumping that hook is a decision about the compiler rather than a formatting bump.
  # A quarterly pull request is rare enough to be read rather than waved through.
  autoupdate_schedule: quarterly

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: ["--maxkb=1024"]
    - id: check-ast
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-json
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-toml
    - id: check-vcs-permalinks
    - id: check-yaml
    - id: debug-statements
    - id: detect-private-key
    - id: destroyed-symlinks
    - id: end-of-file-fixer
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: pretty-format-json
      args: ["--autofix", "--no-sort-keys"]
    - id: trailing-whitespace
      exclude: \.aux$
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: remove-crlf
      exclude_types: [binary]
- repo: https://github.com/hukkin/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
      - mdformat-gfm
      - mdformat-ruff
      - mdformat-config
      # Without this plugin, `mdformat` reads the `---` of a YAML front matter block
      # as a thematic break and rewrites the metadata into a heading.
      - mdformat-frontmatter
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
  - id: reuse
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.0
  hooks:
    - id: check-github-workflows
- repo: https://github.com/typstyle-rs/pre-commit-typstyle
  rev: v0.15.1
  hooks:
    - id: typstyle
- repo: https://github.com/reproducible-reporting/snipwise
  rev: v1.1.0
  hooks:
    - id: snipwise
      args: [fix]
