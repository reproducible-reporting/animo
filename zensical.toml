[project]
site_name = "Animo"
site_url = "https://reproducible-reporting.github.io/animo/"
site_description = "Build dynamic HTML and static PDF presentations using typst from a single source."
site_author = "Toon Verstraelen"
copyright = "Copyright &copy; 2026 Toon Verstraelen"

repo_url = "https://github.com/reproducible-reporting/animo"
repo_name = "reproducible-reporting/animo"
edit_uri = "edit/main/docs/"

extra_css = ["assets/stylesheets/animo.css"]

nav = [
  { "Home" = "index.md" },
  { "Presentation Author Guide" = [
    { "Slides" = "slides.md" },
    { "Tags" = "tags.md" },
    { "Continuous Animations" = "continuous.md" },
    { "Structural Animations" = "structural.md" },
    { "The Viewport" = "viewport.md" },
    { "Regions" = "regions.md" },
    { "Morphs" = "morphs.md" },
    { "Numbering" = "numbering.md" },
    { "Handouts" = "handouts.md" },
    { "Output Types" = "outputs.md" },
    { "Presenting" = "presenting.md" },
    { "Performance" = "performance.md" },
  ] },
  { "Reference" = "reference.md" },
  { "Animo Development Guide" = [
    { "Developing Animo" = "development.md" },
    { "Generative AI Disclaimer" = "genai.md" },
    { "Development Environment" = "environment.md" },
    { "Testing" = "testing.md" },
    { "The Browser Runtime" = "architecture.md" },
    { "Behaviour Probes" = "probes.md" },
  ] },
]

[project.theme]
language = "en"
# Both are symlinks into `logo/`, because zensical only serves files under `docs/`.
# The header is white in light mode, so the logo in it is the teal one.
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# The custom colors are those of the logo, which `docs/assets/stylesheets/animo.css` defines.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
primary = "custom"
accent = "custom"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
primary = "custom"
accent = "custom"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/reproducible-reporting/animo"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

zensical.extensions.macros.render_by_default = false  # set `render_macros: true` in the frontmatter
zensical.extensions.macros.on_error_fail = true
zensical.extensions.macros.on_undefined = "strict"

[project.extra]
typst_version = "0.15.0"

# Zensical writes a preview image for every page into `site/assets/images/social/`
# and links it from the page's `og:image` and `twitter:image` meta tags.
# The card of the home page, `site/assets/images/social/index.png`,
# is also the social preview of the GitHub repository, which is uploaded by hand.
[project.plugins.social]
cards_layout_dir = "logo"
cards_layout = "social-card"
