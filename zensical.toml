[project]
site_name = "Animo"
site_url = "https://reproducible-reporting.github.io/animo/"
site_description = "Presentation package that separates slide content from slide animation"
site_author = "Toon Verstraelen"
copyright = "Copyright &copy; 2026 Toon Verstraelen"

repo_url = "https://github.com/reproducible-reporting/animo"
repo_name = "reproducible-reporting/animo"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Manual" = [
    { "Slides" = "slides.md" },
    { "Tags" = "tags.md" },
    { "Animation" = "animation.md" },
    { "The Four Outputs" = "outputs.md" },
  ] },
  { "Development" = [
    { "Development Environment" = "environment.md" },
    { "Testing" = "testing.md" },
    { "Behaviour Probes" = "probes.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/reproducible-reporting/animo"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
# Examples are included from the real `.typ` files rather than copied into a page,
# so that a documented example cannot drift from the file that the test suite compiles.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
